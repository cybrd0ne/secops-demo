server {
    listen 443 ssl;
    server_name localhost frontdoor.lab;

    ssl_certificate     /etc/nginx/certs/frontdoor.crt;
    ssl_certificate_key /etc/nginx/certs/frontdoor.key;

    location / {
        proxy_pass http://opensearch-dashboards:5601;
        proxy_set_header Host $host;
    }
}
