# .github/workflows/governance.yml
name: governance
on: {push: {branches: [main]}}
permissions: {contents: read, pull-requests: read}
jobs:
  pr-only:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
             n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
             --jq '[.[] | select(.merged_at != null)] | length')
             if [ "$n" -eq 0 ]; then
               echo "::error::${{ github.sha }} reached main without a merged PR (R-01)"; exit 1
             fi
             echo "OK: ${{ github.sha }} arrived through a merged PR"
