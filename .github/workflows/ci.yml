name: ci
on: {pull_request: {branches: [main]}, push: {tags: ['v*']}}
# Default token is read-only; each job widens only what it needs.
permissions: {contents: read}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Every third-party action is pinned to a full commit SHA, tag kept in the comment.
      # Resolve with: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with: {dockerfile: nginx/Dockerfile}
      - run: pip install semgrep && semgrep scan --config p/ci --error
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - run: pip install -r requirements-dev.txt && pytest -q
  scan:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t frontdoor:ci nginx/
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with: {image-ref: 'frontdoor:ci', severity: 'HIGH,CRITICAL', exit-code: '1'}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, test, scan]
    permissions: {contents: write, packages: write, id-token: write} # widened here only
    env:
      IMG: ghcr.io/${{ github.repository }}/frontdoor:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - run: docker build -t "$IMG" nginx/ && docker push "$IMG"
      - uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
        with: {image: '${{ env.IMG }}', format: spdx-json, output-file: sbom.spdx.json}
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - run: cosign sign --yes "$IMG"
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with: {files: sbom.spdx.json, generate_release_notes: true}
